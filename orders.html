<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders — ZIQWEAR</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
</head>
<body data-page="orders">

<div id="announcement"></div>
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head" style="border:0">
      <nav class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>My Orders</span></nav>
      <h1>Track your order</h1>
      <p>Enter the phone number you used at checkout to see your orders and delivery status.</p>
    </div>
  </div>

  <div class="wrap" style="max-width:820px;padding-bottom:90px">
    <form id="track-form" style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <input id="track-phone" placeholder="03xx xxxxxxx" autocomplete="tel"
        style="flex:1;min-width:220px;border:1px solid var(--line);padding:15px 16px;font-size:var(--fs-body);border-radius:2px">
      <button class="btn" type="submit">Find orders</button>
    </form>

    <details style="margin-bottom:24px;border:1px solid var(--line);border-radius:4px">
      <summary style="padding:14px 16px;cursor:pointer;font-size:var(--fs-sm);font-weight:var(--fw-semibold);letter-spacing:var(--ls-flat)">
        Track by email instead
      </summary>
      <div style="padding:16px;border-top:1px solid var(--line-soft)">
        <p style="font-size:var(--fs-meta);color:var(--muted);margin-bottom:14px">
          Enter your order ID and email address — we will send your order status to your inbox.
        </p>
        <form id="email-track-form" style="display:flex;gap:10px;flex-wrap:wrap">
          <input id="et-order" placeholder="Order ID (e.g. ZQ-123456)" autocomplete="off"
            style="flex:1;min-width:160px;border:1px solid var(--line);padding:13px 14px;font-size:var(--fs-sm);border-radius:2px">
          <input id="et-email" type="email" placeholder="Your email address" autocomplete="email"
            style="flex:1;min-width:180px;border:1px solid var(--line);padding:13px 14px;font-size:var(--fs-sm);border-radius:2px">
          <button class="btn" type="submit">Send status</button>
        </form>
        <div id="email-track-msg" style="margin-top:12px"></div>
      </div>
    </details>

    <div id="orders-list"></div>
  </div>
</main>

<footer id="site-footer"></footer>
<div id="cart-drawer"></div>
<div id="search-modal"></div>
<div id="mobile-nav"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/security.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/email.js"></script>
<script src="assets/js/orders.js"></script>
</body>
</html>
