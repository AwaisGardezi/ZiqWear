# ZIQWEAR — nginx site config for a Lightsail Ubuntu instance.
#
# Copy to /etc/nginx/sites-available/ziqwear, replace every ziqwear.com with
# your domain, then:
#   sudo ln -s /etc/nginx/sites-available/ziqwear /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths assume the project sits at /opt/ziqwear (see DEPLOY.md).

upstream ziqwear_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# Shared proxy settings for everything the Node API serves.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --------------------------------------------------------------- http: redirect
server {
    listen 80;
    listen [::]:80;
    server_name ziqwear.com www.ziqwear.com admin.ziqwear.com;

    # Let's Encrypt must still be reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------ www to apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ziqwear.com;

    ssl_certificate     /etc/letsencrypt/live/ziqwear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziqwear.com/privkey.pem;

    return 301 https://ziqwear.com$request_uri;
}

# ----------------------------------------------------------------------------
# Storefront
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ziqwear.com;

    ssl_certificate     /etc/letsencrypt/live/ziqwear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziqwear.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root  /opt/ziqwear/frontend/dist;
    index index.html;

    access_log /var/log/nginx/ziqwear.access.log;
    error_log  /var/log/nginx/ziqwear.error.log;

    # Product photo uploads go through the API, which caps at 10 MB.
    client_max_body_size 12M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # -------------------------------------------------------------- the API
    # /api/v1/* is the React API, /api/* is the legacy storefront API. Both are
    # the same Node process.
    location /api/ {
        proxy_pass http://ziqwear_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app runs with trust proxy = 1, so it reads the FIRST value of
        # these two — nginx must send the client's real values, not append.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Webhook endpoints (Stripe) retry on any non-2xx, so keep them unbuffered
    # and give them the raw body.
    location /api/v1/payments/ {
        proxy_pass http://ziqwear_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://ziqwear_api;
        access_log off;
    }

    # --------------------------------------------------------------- assets
    # Two different things live under /assets and they must both work:
    #   /assets/index-<hash>.js  -> the Vite build in frontend/dist
    #   /assets/img/ziq/*.jpg    -> catalogue photos, served by the Node API
    # Try the built file first, fall through to the API when it is not there.
    location /assets/ {
        try_files $uri @assets_api;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location @assets_api {
        proxy_pass http://ziqwear_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # The original static storefront, served by the Node API.
    location /legacy {
        proxy_pass http://ziqwear_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- the app shell
    # Hashed build files are immutable; index.html must never be cached or the
    # site keeps serving an old bundle after every deploy.
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sitemap.xml {
        proxy_pass http://ziqwear_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://ziqwear_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router owns the paths, so unknown URLs fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------ admin app
# Same API proxy, different document root. Reachable over the public internet
# the moment DNS resolves — decide whether that is acceptable, and if not,
# uncomment the allow-list and put your own IPs in it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.ziqwear.com;

    ssl_certificate     /etc/letsencrypt/live/ziqwear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziqwear.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /opt/ziqwear/admin-dashboard/dist;
    index index.html;

    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;

    # allow 203.0.113.10;   # your office / home IP
    # allow 203.0.113.11;
    # deny all;

    location /api/ {
        proxy_pass http://ziqwear_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://ziqwear_api;
        access_log off;
    }

    location /assets/ {
        try_files $uri @assets_api_admin;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location @assets_api_admin {
        proxy_pass http://ziqwear_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
