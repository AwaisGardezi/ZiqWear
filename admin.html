<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Admin — ZIQWEAR</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
</head>
<body class="adm-body">

<!-- LOGIN -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div id="login-logo"></div>
    <h1>Store Admin</h1>
    <p>Sign in to manage products, orders and site content.</p>
    <form id="login-form">
      <div class="f-group">
        <label class="f-label" for="pw">Password</label>
        <input class="f-input" id="pw" type="password" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button class="abtn" type="submit" id="login-btn" style="width:100%;padding:13px">Sign in</button>
      <p class="login-err" id="login-err">Wrong password. Try again.</p>
      <p class="login-lock" id="login-lock"></p>
    </form>
    <p style="margin-top:20px;font-size:12px"><a href="index.html" style="text-decoration:underline;color:var(--muted)">← Back to store</a></p>
  </div>
</div>

<!-- APP -->
<div class="adm" id="app" style="display:none">
  <aside class="adm-side">
    <div class="adm-side__head" id="side-brand"></div>
    <nav class="adm-side__nav" id="side-nav"></nav>
    <div class="adm-side__foot">
      <a href="index.html" target="_blank" rel="noopener noreferrer">View storefront ↗</a>
      <button id="logout">Sign out</button>
    </div>
  </aside>
  <div class="adm-main">
    <header class="adm-top">
      <h1 id="adm-title">Dashboard</h1>
      <div class="adm-top__actions" id="adm-actions"></div>
    </header>
    <div class="adm-body" id="adm-view"></div>
  </div>
</div>

<div class="amodal" id="amodal">
  <div class="amodal__scrim" data-close-modal></div>
  <div class="amodal__panel" id="amodal-panel">
    <div class="amodal__head">
      <h3 id="amodal-title">Edit</h3>
      <button class="icon-btn" data-close-modal aria-label="Close">✕</button>
    </div>
    <div class="amodal__body" id="amodal-body"></div>
    <div class="amodal__foot" id="amodal-foot"></div>
  </div>
</div>

<div id="toast-root" class="toasts" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/media.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/email.js"></script>
<script src="assets/js/security.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
