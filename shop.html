<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All — ZIQWEAR</title>
<meta name="description" content="Shop the full ZIQWEAR collection — graphic tees, gothic prints and compression sets. Cash on delivery across Pakistan.">
<meta property="og:title" content="Shop All — ZIQWEAR">
<meta property="og:description" content="The full ZIQWEAR collection — graphic tees, gothic prints and compression sets. Cash on delivery across Pakistan.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZIQWEAR">
<meta property="og:locale" content="en_PK">
<meta property="og:url" content="https://ziqwear.com/shop.html">
<meta property="og:image" content="https://ziqwear.com/assets/img/ziq/cat-tees.jpg">
<meta property="og:image:alt" content="ZIQWEAR graphic streetwear collection">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shop All — ZIQWEAR">
<meta name="twitter:description" content="The full ZIQWEAR collection — graphic tees, gothic prints and compression sets.">
<meta name="twitter:image" content="https://ziqwear.com/assets/img/ziq/cat-tees.jpg">
<link rel="canonical" href="https://ziqwear.com/shop.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
</head>
<body data-page="shop">

<div id="announcement"></div>
<header id="site-header"></header>

<main>
  <div class="page-head">
    <div class="wrap">
      <nav class="breadcrumb" id="crumb"></nav>
      <h1 id="shop-title">All Products</h1>
      <p id="shop-desc"></p>
    </div>
  </div>

  <div class="wrap">
    <div class="shop-layout">
      <aside class="filters" id="filters"></aside>
      <div class="shop-main">
        <div class="shop-toolbar">
          <span class="shop-count" id="shop-count"></span>
          <div style="display:flex;align-items:center;gap:10px">
            <button class="btn btn--ghost btn--sm" id="open-filters" style="display:none">Filters</button>
            <select class="select" id="sort">
              <option value="featured">Featured</option>
              <option value="newest">Newest</option>
              <option value="best">Best selling</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Alphabetical</option>
            </select>
          </div>
        </div>
        <div class="active-filters" id="active-filters"></div>
        <div id="grid"></div>
        <div class="load-more-wrap" id="load-more-wrap"></div>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<div id="cart-drawer"></div>
<div id="search-modal"></div>
<div id="mobile-nav"></div>
<div id="filter-drawer" class="mdrawer">
  <div class="mdrawer__scrim" data-close-filters></div>
  <div class="mdrawer__panel">
    <div class="mdrawer__head">
      <h3 style="font-family:var(--font-ui);font-size:var(--fs-minor);letter-spacing:var(--ls-caps-lg);text-transform:uppercase">Filters</h3>
      <button class="icon-btn" data-close-filters aria-label="Close">✕</button>
    </div>
    <div class="mdrawer__body" id="filter-drawer-body"></div>
    <div class="mdrawer__foot"><button class="btn btn--full" data-close-filters>Show results</button></div>
  </div>
</div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/security.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
